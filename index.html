<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi người tớ thương ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts for cute and hand-written vibes -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Floating Hearts Background Container -->
    <div class="hearts-background" id="heartsBg"></div>


    <div class="app-container">

        <!-- STAGE 1: Envelope (Bức thư lãng mạn) -->
        <div class="stage" id="stage1">
            <div class="confession-title">Tớ có một bức thư gửi cho cậu... 🌸</div>
            <div class="envelope-wrapper">
                <div class="envelope" id="envelope">
                    <div class="letter">
                        <div class="letter-text">
                            <span class="highlight">Gửi Cậu,</span>
                            <p>Tớ đã gom góp tất cả những khoảnh khắc dịu dàng nhất, vẽ nên một chút tình cảm bé nhỏ này
                                gửi tặng cậu.</p>
                            <p>Hãy bấm nút bên dưới nhé! 👇</p>
                        </div>
                    </div>
                    <div class="flap"></div>
                    <div class="pocket"></div>
                </div>
            </div>
            <button class="btn btn-primary" id="openLetterBtn">Mở Thư Ngay ❤️</button>
        </div>

        <!-- STAGE 2: Slideshow (Thư viện ảnh kỷ niệm) -->
        <div class="stage hidden" id="stage2">
            <div class="card glass slideshow-card">
                <div class="slideshow-container">
                    <img id="slideshowImg" src="" alt="Memory Image" class="slideshow-img">
                </div>

                <div class="slideshow-dots" id="slideshowDots">
                    <!-- Dots will be populated dynamically -->
                </div>

                <button class="btn btn-primary" id="nextSlideBtn">Tiếp tục ❤️</button>
            </div>
        </div>

        <!-- STAGE 4: Success & Confetti (Màn hình thành công) -->
        <div class="stage hidden" id="stage4">
            <div class="card glass success-card">
                <div class="avatar-container">
                    <div class="cute-animated-love">
                        <!-- Two cats together cuddling (simplified SVG) -->
                        <svg viewBox="0 0 120 100" class="cats-svg">
                            <!-- Cat Left (Pinkish) -->
                            <path d="M 30,75 A 20,20 0 0,1 70,75 L 70,80 L 30,80 Z" fill="#ffe5ec" />
                            <path d="M 30,65 Q 40,55 50,65 L 50,75 L 30,75 Z" fill="#ffe5ec" />
                            <polygon points="30,65 35,50 42,62" fill="#ffe5ec" />
                            <polygon points="50,65 45,50 38,62" fill="#ffe5ec" />
                            <circle cx="38" cy="62" r="1.5" fill="#5c3d48" />
                            <circle cx="48" cy="62" r="1.5" fill="#5c3d48" />
                            <path d="M 41,65 Q 43,67 45,65" fill="none" stroke="#5c3d48" stroke-width="1" />

                            <!-- Cat Right (Cream) -->
                            <path d="M 50,75 A 20,20 0 0,1 90,75 L 90,80 L 50,80 Z" fill="#fdf0d5" />
                            <path d="M 50,65 Q 60,55 70,65 L 70,75 L 50,75 Z" fill="#fdf0d5" />
                            <polygon points="50,65 55,50 62,62" fill="#fdf0d5" />
                            <polygon points="70,65 65,50 58,62" fill="#fdf0d5" />
                            <circle cx="58" cy="62" r="1.5" fill="#5c3d48" />
                            <circle cx="68" cy="62" r="1.5" fill="#5c3d48" />
                            <path d="M 61,65 Q 63,67 65,65" fill="none" stroke="#5c3d48" stroke-width="1" />

                            <!-- Heart on top -->
                            <path d="M12 4.419c-2.826-5.695-11.999-4.064-11.999 3.27 0 7.27 9.903 10.938 11.999 15.311 2.096-4.373 12-8.041 12-15.311 0-7.327-9.17-8.972-12-3.27z"
                                transform="translate(48, 25) scale(0.8)" fill="#ff4d6d" class="pulsing-heart" />
                        </svg>
                    </div>
                </div>
                <h2 class="title-love font-handwritten" id="finalTitle">thế thôi =))</h2>
                <div class="message-box">
                    <p class="final-text" id="finalText"></p>
                    <p class="note-text" id="finalNote"></p>
                </div>
            </div>
        </div>

    </div>

    <!-- Canvas for Confetti -->
    <canvas id="confettiCanvas"></canvas>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
